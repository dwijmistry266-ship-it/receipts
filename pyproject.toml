[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "receipts-py"
version = "0.1.0"
description = "Verify your agent's claims against the evidence, deterministically."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dwij Mistry" }]
keywords = ["ai-agents", "verification", "cli", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
receipts = "receipts.cli:main"

[project.urls]
Homepage = "https://github.com/dwijmistry266-ship-it/receipts"

[tool.setuptools.packages.find]
include = ["receipts*"]
